<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PaglaROUTER — Unified LLM Gateway">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="0.6" stop-color="#14151B"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B7EFF"/>
      <stop offset="1" stop-color="#8F9BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6B7EFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6B7EFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="260" fill="url(#glow)"/>
  <circle cx="150" cy="320" r="220" fill="url(#glow)"/>

  <g stroke="#1E2027" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- node motif: gateway hub -->
  <g transform="translate(150,170)">
    <circle cx="0" cy="0" r="14" fill="#0A0A0B" stroke="#6B7EFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#6B7EFF"/>
    <line x1="14" y1="0" x2="90" y2="60" stroke="#1E2027" stroke-width="2"/>
    <line x1="14" y1="0" x2="90" y2="-60" stroke="#1E2027" stroke-width="2"/>
    <line x1="14" y1="0" x2="90" y2="0" stroke="#1E2027" stroke-width="2"/>
    <circle cx="96" cy="64" r="6" fill="#8A8F9E"/>
    <circle cx="96" cy="-62" r="6" fill="#E5E7EB"/>
    <circle cx="96" cy="0" r="6" fill="#6B7EFF"/>
  </g>

  <text x="90" y="330" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8A8F9E">
    Gemini · Groq · Qwen · Kimi · GitHub · Cerebras · Mistral · OpenRouter
  </text>

  <text x="420" y="148" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="60" font-weight="800" fill="#FBFBF9">Pagla<span fill="#6B7EFF">ROUTER</span></text>
  <text x="422" y="190" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#8A8F9E">
    Unified LLM gateway for the PaglaAI ecosystem
  </text>
  <text x="422" y="222" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5A5F6E">
    One OpenAI + Anthropic endpoint · weight-selected multi-provider routing · multi-account aggregation
  </text>

  <rect x="422" y="246" width="216" height="40" rx="20" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="530" y="272" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#8F9BFF" text-anchor="middle">router.paglaai.space/v1</text>

  <text x="422" y="316" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="15" font-style="italic" fill="#E5E7EB">
    Intelligence Unhinged
  </text>
</svg>
