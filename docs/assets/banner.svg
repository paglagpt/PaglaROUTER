<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PaglaROUTER — Unified LLM Gateway">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- single brand accent line -->
  <rect x="120" y="238" width="56" height="4" rx="2" fill="#6B7EFF"/>

  <text x="120" y="120" font-family="'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">PaglaROUTER</text>

  <text x="122" y="164" font-family="'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="400" fill="#A1A1AA">
