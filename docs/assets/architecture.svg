<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="PaglaROUTER architecture">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B7EFF"/>
      <stop offset="1" stop-color="#8F9BFF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="470" fill="url(#abg)"/>

  <!-- Clients -->
  <g>
    <text x="20" y="28" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8A8F9E">CLIENTS</text>
    <rect x="20" y="40" width="170" height="58" rx="8" fill="#14151B" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="105" y="68" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBFBF9" text-anchor="middle">OpenAI SDK</text>
    <text x="105" y="86" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5F6E" text-anchor="middle">POST /v1/chat/completions</text>
    <rect x="20" y="110" width="170" height="58" rx="8" fill="#14151B" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="105" y="138" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBFBF9" text-anchor="middle">Anthropic SDK</text>
    <text x="105" y="156" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5F6E" text-anchor="middle">POST /v1/messages</text>
  </g>

  <!-- Worker -->
  <rect x="280" y="40" width="340" height="120" rx="10" fill="#14151B" stroke="url(#accent2)" stroke-width="1.5"/>
  <text x="450" y="66" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8F9BFF" text-anchor="middle">CLOUDFLARE WORKER (Hono)</text>
  <text x="450" y="92" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8A8F9E" text-anchor="middle">src/index.ts</text>
  <text x="450" y="112" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8A8F9E" text-anchor="middle">src/config.ts  ·  src/types.ts</text>
  <text x="450" y="132" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8A8F9E" text-anchor="middle">src/adapters/ (gemini, groq, qwen, kimi, …)</text>

  <!-- Scheduler -->
  <rect x="280" y="210" width="340" height="92" rx="10" fill="#14151B" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="450" y="236" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#E5E7EB" text-anchor="middle">SCHEDULER / WEIGHT ENGINE</text>
  <text x="450" y="258" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8A8F9E" text-anchor="middle">computeWeight · evaluateAccount</text>
  <text x="450" y="278" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8A8F9E" text-anchor="middle">sliding-window buckets · circuit breakers</text>

  <!-- Telemetry -->
  <rect x="280" y="352" width="340" height="92" rx="10" fill="#14151B" stroke="#8A8F9E" stroke-width="1.5"/>
  <text x="450" y="378" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8A8F9E" text-anchor="middle">TELEMETRY</text>
  <text x="450" y="400" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8A8F9E" text-anchor="middle">estimatePromptTokens (BPE) · parseRateLimit</text>
  <text x="450" y="420" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8A8F9E" text-anchor="middle">classifyProviderError · usage reconciliation</text>

  <!-- KV -->
  <rect x="700" y="210" width="180" height="92" rx="10" fill="#14151B" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="790" y="240" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#E5E7EB" text-anchor="middle">KV PAGLA_TELEMETRY_KV</text>
  <text x="790" y="262" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5F6E" text-anchor="middle">quota:&lt;accountId&gt;</text>
  <text x="790" y="280" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5F6E" text-anchor="middle">state:&lt;accountId&gt;</text>

  <!-- Providers -->
  <text x="20" y="330" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8A8F9E">PROVIDERS</text>
  <g>
    <rect x="20" y="352" width="110" height="46" rx="8" fill="#14151B" stroke="#6B7EFF" stroke-width="1.5"/>
    <text x="75" y="380" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#FBFBF9" text-anchor="middle">Gemini</text>
    <rect x="142" y="352" width="110" height="46" rx="8" fill="#14151B" stroke="#6B7EFF" stroke-width="1.5"/>
    <text x="197" y="380" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#FBFBF9" text-anchor="middle">Groq</text>
  </g>
  <g>
    <rect x="20" y="408" width="110" height="46" rx="8" fill="#14151B" stroke="#6B7EFF" stroke-width="1.5"/>
    <text x="75" y="436" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#FBFBF9" text-anchor="middle">Qwen</text>
    <rect x="142" y="408" width="110" height="46" rx="8" fill="#14151B" stroke="#6B7EFF" stroke-width="1.5"/>
    <text x="197" y="436" font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#FBFBF9" text-anchor="middle">Kimi</text>
    <rect x="20" y="270" width="0" height="0" fill="none"/>
  </g>

  <!-- Edges -->
  <g stroke="#2A2C36" stroke-width="2" fill="none">
    <path d="M190 69 C 235 69, 235 90, 280 90"/>
    <path d="M190 139 C 235 139, 235 110, 280 110"/>
    <path d="M450 160 L 450 210"/>
    <path d="M450 302 L 450 352"/>
    <path d="M450 190 C 560 190, 560 252, 700 252"/>
    <path d="M620 260 C 660 260, 660 256, 700 256"/>
    <path d="M280 300 C 200 300, 200 375, 130 375"/>
    <path d="M280 400 C 210 400, 200 408, 152 408"/>
  </g>
  <g font-family="Inter, 'Open Sans', ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#5A5F6E">
    <text x="228" y="60">POST /v1</text>
    <text x="520" y="332">weight select</text>
    <text x="470" y="182">dispatch</text>
    <text x="620" y="330">read/write</text>
    <text x="360" y="318">route to best account</text>
    <text x="196" y="400">upstream</text>
  </g>
</svg>
