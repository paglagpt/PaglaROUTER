name: Deploy Docs

# Builds the docs/ Jekyll site and publishes it to GitHub Pages at
# https://paglagpt.github.io/PaglaROUTER/
#
# NOTE: actions/configure-pages@v5 is intentionally NOT used — it fails with a
# cryptic "TypeError: error must be an instance of Error" on this repository
# (known bug that masks a Pages REST API issue). The docs are built with the
# official Jekyll Pages container instead, then uploaded + deployed directly.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: jekyll/jekyll:pages
      options: --entrypoint=""
    steps:
      - uses: actions/checkout@v4
      - name: Build Jekyll site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd docs
          jekyll build --config _config.yml --baseurl /PaglaROUTER
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
