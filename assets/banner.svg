<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PaglaROUTER — Unified LLM Gateway">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f0ff"/>
      <stop offset="1" stop-color="#9fb6dd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="260" fill="url(#glow)"/>
  <circle cx="150" cy="320" r="220" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1f2b45" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- node motif: gateway hub -->
  <g transform="translate(150,170)">
    <circle cx="0" cy="0" r="14" fill="#101828" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#22d3ee"/>
    <line x1="14" y1="0" x2="90" y2="60" stroke="#1f2b45" stroke-width="2"/>
    <line x1="14" y1="0" x2="90" y2="-60" stroke="#1f2b45" stroke-width="2"/>
    <line x1="14" y1="0" x2="90" y2="0" stroke="#1f2b45" stroke-width="2"/>
    <circle cx="96" cy="64" r="6" fill="#10b981"/>
    <circle cx="96" cy="-62" r="6" fill="#f59e0b"/>
    <circle cx="96" cy="0" r="6" fill="#22d3ee"/>
  </g>

  <text x="90" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7c8bab">
    Gemini · Groq · Qwen · Kimi · GitHub · Cerebras · Mistral · OpenRouter
  </text>

  <text x="420" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="60" font-weight="800" fill="url(#textgrad)">Pagla<span fill="#22d3ee">ROUTER</span></text>
  <text x="422" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#7c8bab">
    Unified LLM gateway for the PaglaAI ecosystem
  </text>
  <text x="422" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5d6b8a">
    One OpenAI + Anthropic endpoint · weight-selected multi-provider routing · multi-account aggregation
  </text>

  <rect x="422" y="252" width="216" height="40" rx="20" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="530" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#22d3ee" text-anchor="middle">router.paglaai.space/v1</text>
</svg>
